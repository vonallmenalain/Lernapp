<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="application-name" content="Lernapp" />
    <meta name="description" content="Raetsel fuer Kinder mit Arukone, Meerestieren, Kakuro, Tiergehegen, Hidoku und Sudoku." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lernapp" />
    <meta name="theme-color" content="#6c5ce7" />
    <title>Meerestiere Levels · Lernapp</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="manifest" href="app.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png" />
  </head>
  <body data-game-page="bimaru">
    <main class="app-shell">
      <section class="hero" aria-labelledby="app-title">
        <p class="eyebrow">Im Wasser suchen</p>
        <h1 id="app-title">Meerestiere</h1>
        <p id="app-intro" class="intro">Finde alle versteckten Meerestiere im Wasser.</p>
      </section>

      <section id="level-panel" class="start-panel" aria-label="Meerestiere Level auswählen">
        <div class="start-copy">
          <p class="small-label">Levelauswahl</p>
          <h2 id="level-heading">Meerestiere Levels</h2>
          <p id="level-description"></p>
          <ul id="rules-list" class="rules-list"></ul>
        </div>
        <div id="level-grid" class="level-grid" aria-label="Meerestiere Levels"></div>
      </section>

      <section id="game-panel" class="game-panel" hidden>
        <div id="game-controls" class="controls" aria-label="Rätselsteuerung" hidden>
          <a id="home-button" class="icon-button" href="index.html" aria-label="Zurück zur Spielauswahl" title="Zurück zur Spielauswahl">⌂</a>
          <button id="back-button" class="icon-button" type="button" aria-label="Zurück zur Levelauswahl" title="Zurück zur Levelauswahl">⇤</button>
          <button id="undo-button" class="icon-button" type="button" aria-label="Letzten Schritt rückgängig machen" title="Letzten Schritt rückgängig machen">↶</button>
          <button id="reset-button" class="icon-button" type="button" aria-label="Level neu starten" title="Level neu starten">↻</button>
        </div>

        <section class="game-card">
          <div class="status-row">
            <div>
              <p class="small-label">Aktuelles Level</p>
              <h2 id="puzzle-title">Level</h2>
              <p id="puzzle-description" class="puzzle-description"></p>
            </div>
            <p id="status" class="status" role="status" aria-live="polite">Wähle ein Level aus.</p>
          </div>

          <div id="board" class="board" aria-label="Meerestiere Spielfeld"></div>
          <div id="number-pad" class="number-pad" aria-label="Zahlen auswählen" hidden></div>

          <details class="help" open>
            <summary>So spielst du Meerestiere</summary>
            <ul id="game-help-list"></ul>
          </details>
        </section>
      </section>

    </main>
    <script src="app.js"></script>
    <script src="pwa.js"></script>
  </body>
</html>
