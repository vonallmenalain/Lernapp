<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="application-name" content="Lernapp" />
    <meta name="description" content="Buchstaben-Jagd: Anfangslaute hören für Kinder von 4 bis 8 Jahren." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lernapp" />
    <meta name="theme-color" content="#6c5ce7" />
    <title>Buchstaben-Jagd Levels · Lernapp</title>
    <link rel="stylesheet" href="styles.css?v=2026-09-09-7" />
    <link rel="manifest" href="app.webmanifest?v=2026-09-09-7" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png" />
  </head>
  <body data-game-page="letterPuzzle">
    <main class="app-shell">
      <section class="hero" aria-labelledby="app-title">
        <h1 id="app-title">Buchstaben-Jagd</h1>
      </section>

      <section id="level-panel" class="start-panel" aria-label="Buchstaben-Jagd Level auswählen">
        <div class="start-copy">
          <p class="small-label">Levelauswahl</p>
          <h2 id="level-heading">Schwierigkeit wählen</h2>
          <p id="level-description"></p>
        </div>
        <div id="level-grid" class="level-grid" aria-label="Buchstaben-Jagd Levels"></div>
      </section>

      <section id="game-panel" class="game-panel" hidden>
        <div id="game-controls" class="controls" aria-label="Rätselsteuerung" hidden>
          <a id="home-button" class="icon-button" href="index.html" aria-label="Zurück zur Spielauswahl" title="Zurück zur Spielauswahl">⌂</a>
          <button id="back-button" class="icon-button" type="button" aria-label="Zurück zur Levelauswahl" title="Zurück zur Levelauswahl">⇤</button>
          <button id="reset-button" class="icon-button" type="button" aria-label="Level neu starten" title="Level neu starten">↻</button>
        </div>

        <section class="game-card">
          <div class="status-row">
            <div>
              <p class="small-label">Aktuelles Level</p>
              <h2 id="puzzle-title">Level</h2>
              <p id="puzzle-description" class="puzzle-description"></p>
            </div>
            <p id="status" class="status" role="status" aria-live="polite">Wähle ein Level aus.</p>
          </div>

          <div id="board" class="board" aria-label="Buchstaben-Jagd Aufgabenfeld"></div>
          <div id="number-pad" class="number-pad" aria-label="Auswahl" hidden></div>
        </section>
      </section>

    </main>
    <script defer src="https://www.gstatic.com/firebasejs/12.7.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/12.7.0/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore-compat.js"></script>
    <script defer src="highscore.js?v=2026-09-09-7"></script>
    <script defer src="firebase.js?v=2026-09-09-7"></script>
    <script defer src="spatial-puzzles.js?v=2026-09-09-7"></script>
    <script defer src="kids.js?v=2026-09-09-7"></script>
    <script defer src="train-art.js?v=2026-09-09-7"></script>
    <script defer src="train-scenes.js?v=2026-09-09-7"></script>
    <script defer src="app.js?v=2026-09-09-7"></script>
    <script defer src="pwa.js?v=2026-09-09-7"></script>
  </body>
</html>
