<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Labyrinth Levels · Lernapp</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-game-page="maze">
    <main class="app-shell">
      <section class="hero" aria-labelledby="app-title">
        <p class="eyebrow">Weg finden</p>
        <h1 id="app-title">Labyrinth</h1>
        <p id="app-intro" class="intro">Finde den Weg zum Ziel und beachte die Regel.</p>
      </section>

      <section id="level-panel" class="start-panel" aria-label="Labyrinth Level auswählen">
        <div class="start-copy">
          <p class="small-label">Levelauswahl</p>
          <h2 id="level-heading">Labyrinth Levels</h2>
          <p id="level-description"></p>
          <ul id="rules-list" class="rules-list"></ul>
        </div>
        <div id="level-grid" class="level-grid" aria-label="Labyrinth Levels"></div>
      </section>

      <section id="game-panel" class="game-panel" hidden>
        <div id="game-controls" class="controls" aria-label="Rätselsteuerung" hidden>
          <a id="home-button" class="icon-button" href="index.html" aria-label="Zurück zur Spielauswahl" title="Zurück zur Spielauswahl">⌂</a>
          <button id="back-button" class="icon-button" type="button" aria-label="Zurück zur Levelauswahl" title="Zurück zur Levelauswahl">⇤</button>
          <button id="undo-button" class="icon-button" type="button" aria-label="Letzten Schritt rückgängig machen" title="Letzten Schritt rückgängig machen">↶</button>
          <button id="reset-button" class="icon-button" type="button" aria-label="Level neu starten" title="Level neu starten">↻</button>
          <button id="hint-button" class="icon-button hint-button" type="button" aria-label="Tipp anzeigen" title="Tipp anzeigen">💡</button>
        </div>

        <section class="game-card">
          <div class="status-row">
            <div>
              <p class="small-label">Aktuelles Level</p>
              <h2 id="puzzle-title">Level</h2>
              <p id="puzzle-description" class="puzzle-description"></p>
            </div>
            <p id="status" class="status" role="status" aria-live="polite">Wähle ein Level aus.</p>
          </div>

          <div id="board" class="board" aria-label="Labyrinth Spielfeld"></div>
          <div id="number-pad" class="number-pad" aria-label="Zahlen auswählen" hidden></div>

          <details class="help" open>
            <summary>So spielst du Labyrinth</summary>
            <ul id="game-help-list"></ul>
          </details>
        </section>
      </section>

      <section id="success-overlay" class="success-overlay hidden" aria-labelledby="success-title" aria-modal="true" role="dialog" hidden>
        <div class="success-modal">
          <p class="success-eyebrow">Rätsel gelöst</p>
          <h2 id="success-title">Geschafft!</h2>
          <p id="success-text" class="success-text">Super gemacht! Du hast das Level gelöst.</p>
          <div class="success-actions">
            <button id="next-puzzle-button" type="button">Nächstes Level</button>
            <button id="success-close" class="secondary-button" type="button">Weiter üben</button>
          </div>
        </div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
