<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="application-name" content="Mini-Games" />
    <meta name="description" content="Mini-Games von Gripszug: eine Runde spielen, Namen eintragen, oben stehen. Ohne Konto, ohne Anmeldung – die Bestenliste sehen alle." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mini-Games" />
    <meta name="theme-color" content="#a8ddf0" />
    <title>Mini-Games · Gripszug</title>
    <link rel="stylesheet" href="../styles.css?v=2026-09-19-23" />
    <link rel="manifest" href="app.webmanifest?v=2026-09-19-23" />
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/mini-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../icons/mini-180.png" />
  </head>
  <!-- Diese Seite sieht kein Kind auf dem Weg durch die App, sondern jemand,
       dem ein Link geschickt wurde. Deshalb steht hier Text, und deshalb steht
       am body data-mini: Daran erkennen firebase.js (kein Besuch zählen) und
       das Stylesheet (kein Konto-Knopf), dass wir neben der App stehen und
       nicht in ihr. Gebaut wird der Inhalt von mini-games.js.

       Diese Seite ist zugleich der Startpunkt der eigenen App: Wer die
       Mini-Games auf den Startbildschirm legt, landet hier. Das Manifest
       daneben sagt, wie sie heisst und wie sie aussieht; pwa.js meldet den
       Service Worker in diesem Ordner an – und damit einen eigenen, der nur
       /mini-games/ bedient. -->
  <body data-page="mini-hub" data-mini="1">
    <main class="mini-seite" data-mini-uebersicht>
      <p class="mini-hinweis">Die Mini-Games werden geladen...</p>
    </main>

    <script defer src="https://www.gstatic.com/firebasejs/12.7.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/12.7.0/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore-compat.js"></script>
    <script defer src="../highscore.js?v=2026-09-19-23"></script>
    <script defer src="../firebase.js?v=2026-09-19-23"></script>
    <script defer src="../mini-games.js?v=2026-09-19-23"></script>
    <script defer src="../pwa.js?v=2026-09-19-23"></script>
  </body>
</html>
