# Die App sind die Dateien im Wurzelverzeichnis; gebaut wird nichts. Aber
# veröffentlicht wird nicht das Wurzelverzeichnis: Daneben liegen Werkzeuge,
# Regeln, Doku und der Server, und nach dem Installieren der Server-Pakete
# hundert Megabyte node_modules. netlify/build.mjs kopiert nur die App nach
# dist/, und dist/ geht auf die Site.
#
# Die Funktionen brauchen Umgebungsvariablen (Site configuration → Environment
# variables): FIREBASE_SERVICE_ACCOUNT, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
# STRIPE_PRICE_ID. Welche wofür, steht in FIREBASE_SETUP.md, Abschnitt 3b.

[build]
  publish = "dist"
  # Nur die Pakete der Funktionen (dependencies), nicht die Prüfwerkzeuge –
  # dann die App nach dist/ kopieren.
  command = "npm ci --omit=dev --no-audit --no-fund && node netlify/build.mjs"

[build.environment]
  # Node 22: firebase-admin verlangt es, und Netlify lässt die Funktionen mit
  # derselben Node-Fassung laufen, mit der gebaut wurde.
  NODE_VERSION = "22"
  NPM_FLAGS = "--omit=dev"
  # Netlify sucht nach dem Bauen in allen Dateien nach Geheimnissen und bricht
  # ab, wenn es eines zu finden glaubt. Der Web-API-Schlüssel von Firebase in
  # firebase.js sieht für den Scanner so aus – er ist aber kein Geheimnis: Er
  # steht in jeder App, die Firebase im Browser nutzt, und die Firestore-Regeln
  # schützen die Daten, nicht dieser Schlüssel.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyDJKaBS1W-EU6d8N3pL2R4amSl8R0vD-Uc"

[functions]
  directory = "netlify/functions"
  # nft statt esbuild: Es bündelt nicht, sondern sammelt die Dateien ein, die
  # eine Funktion wirklich lädt – und kommt so auch mit den Teilen von
  # firebase-admin zurecht, an denen esbuild scheitert (gRPC, dynamische
  # Requires). Etwas grössere Pakete, dafür keine Überraschung.
  node_bundler = "nft"

# --- Die Mini-Games sind ausgezogen ------------------------------------------
# Sie stehen als eigene App unter games.alae.app, mit eigener Firebase und
# eigenem Adminbereich. Unter kids.alae.app/mini-games/ liegt nichts mehr.
#
# Die Adressen bleiben trotzdem gültig: Sie wurden verschickt – in Nachrichten,
# in Gruppen –, und ein Link, den jemand weitergegeben hat, soll nicht ins
# Leere zeigen. /mini-games/turmbau führt auf games.alae.app/turmbau; die
# Spiele heissen dort gleich.
#
# Die Reihenfolge zählt: Der Service Worker steht vor der allgemeinen Regel,
# sonst würde auch er umgeleitet.

# Der alte Service Worker wird nicht umgeleitet, sondern ersetzt. Warum, steht
# in mini-games-abschied.js.
[[redirects]]
  from = "/mini-games/service-worker.js"
  to = "/mini-games-abschied.js"
  status = 200
  force = true

[[redirects]]
  from = "/mini-games"
  to = "https://games.alae.app/"
  status = 301
  force = true

[[redirects]]
  from = "/mini-games/*"
  to = "https://games.alae.app/:splat"
  status = 301
  force = true
