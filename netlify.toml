# Die App sind die Dateien im Wurzelverzeichnis; gebaut wird nichts. Was hier
# steht, ist nur für die Server-Funktionen nötig – und dafür, dass ihr Code
# und die installierten Pakete nicht als Teil der Site abrufbar sind.

[build]
  # Wurzelverzeichnis veröffentlichen, wie bisher in den Site-Einstellungen.
  publish = "."
  # Nur die Pakete der Funktionen installieren (dependencies), nicht die
  # Prüfwerkzeuge (devDependencies) – die sind gross und hier nutzlos.
  command = "npm ci --omit=dev --no-audit --no-fund"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--omit=dev"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # firebase-admin bringt Teile mit, die esbuild nicht einpacken kann (gRPC,
  # dynamische Requires). Als "external" werden sie mitkopiert statt gebündelt.
  external_node_modules = ["firebase-admin", "stripe"]

# Was auf dem Server liegt, hat im Browser nichts verloren. Die Funktionen
# selbst laufen unter /api/…; ihre Quelldateien und die Pakete bleiben zu.
[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/index.html"
  status = 404
  force = true
