<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="application-name" content="Lernapp" />
    <meta name="description" content="Tier-Sprung: ein Jump-and-Run für Kinder. Zehn Level, zehn Tiere – von der kleinen Maus bis zum Elefanten." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lernapp" />
    <meta name="theme-color" content="#6c5ce7" />
    <title>Tier-Sprung · Lernapp</title>
    <link rel="stylesheet" href="styles.css?v=2026-09-09-1" />
    <link rel="manifest" href="app.webmanifest?v=2026-09-09-1" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png" />
  </head>
  <body data-page="runner">
    <!-- Die Levelwahl baut tiersprung.js auf der Spielhuelle: dieselbe
         Landschaft wie das Startbild, oben dieselben Knoepfe. Die Spielflaeche
         darunter legt sich beim Start darueber. -->
    <div id="ts-stage" class="cm-stage ts-stage" aria-label="Tier-Sprung"></div>

    <div id="runner-stage" class="runner-stage" tabindex="-1" hidden>
      <canvas id="runner-canvas" class="runner-canvas"></canvas>
      <div class="runner-hud">
        <div class="runner-hud-row">
          <button id="runner-quit" class="runner-hud-button" type="button" aria-label="Spiel verlassen" title="Spiel verlassen">✕</button>
          <div id="runner-hearts" class="runner-hearts" role="img" aria-label="Leben"></div>
          <p class="runner-treats"><span id="runner-treat-icon" aria-hidden="true">🧀</span><span id="runner-treat-count">0</span></p>
          <button id="runner-fullscreen" class="runner-hud-button" type="button" aria-label="Vollbild" title="Vollbild">⛶</button>
          <button id="runner-pause" class="runner-hud-button" type="button" aria-label="Pause" title="Pause">❚❚</button>
        </div>
        <div class="runner-progress">
          <span class="runner-progress-track" aria-hidden="true">
            <span id="runner-progress-fill" class="runner-progress-fill"></span>
            <span id="runner-progress-marker" class="runner-progress-marker">🐭</span>
          </span>
          <span id="runner-level-label" class="runner-stage-label"></span>
        </div>
      </div>
      <div id="runner-overlay" class="runner-overlay" hidden></div>
    </div>

    <script defer src="https://www.gstatic.com/firebasejs/12.7.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/12.7.0/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore-compat.js"></script>
    <script defer src="firebase.js?v=2026-09-09-1"></script>
    <script defer src="kids.js?v=2026-09-09-1"></script>
    <script defer src="train-art.js?v=2026-09-09-1"></script>
    <script defer src="train-scenes.js?v=2026-09-09-1"></script>
    <script defer src="game-cloud.js?v=2026-09-09-1"></script>
    <script defer src="game-shell.js?v=2026-09-09-1"></script>
    <script defer src="tiersprung.js?v=2026-09-09-1"></script>
    <script defer src="pwa.js?v=2026-09-09-1"></script>
  </body>
</html>
